[package]
name = "video_optimizer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
warp = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
num_cpus = "1.16"
indicatif = "0.17"

[[bin]]
name = "video_optimizer"
path = "src/main.rs"
