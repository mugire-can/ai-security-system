name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Opt into Node.js 24 early to avoid deprecation warnings for actions/checkout,
  # actions/setup-python, and actions/upload-artifact which still run on Node.js 20.
  # GitHub will enforce Node.js 24 by default from June 2, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml

      - name: Validate evaluation scaffold
        run: |
          python scripts/validate_evaluation_manifest.py

      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Flake8 logical checks
        run: |
          python -m flake8 config src tests scripts main.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Black format check
        run: |
          python -m black --check config src tests scripts main.py

      - name: isort import order check
        run: |
          python -m isort --check-only config src tests scripts main.py

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Bandit
        run: |
          python -m bandit -r config src scripts main.py \
            -f json -o bandit-report.json

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7
