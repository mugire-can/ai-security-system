name: Tests & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Free up disk space (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf ~/.cache/pip
        sudo rm -rf /tmp/*
        sudo apt-get clean
        docker system prune -a --force || true

    - name: Free up disk space (Windows only)
      if: runner.os == 'Windows'
      run: |
        Remove-Item -Path $env:LOCALAPPDATA\pip\cache -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path C:\Users\*\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue

    - name: Install minimal dependencies for testing
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pytest pytest-cov pydantic numpy
        pip install --no-cache-dir --prefer-binary sqlalchemy

    - name: Run pytest with coverage
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        pip install --no-cache-dir flake8 black isort

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      continue-on-error: true

    - name: Format check with black
      run: |
        black --check src/ --line-length=100
      continue-on-error: true

    - name: Import sort check with isort
      run: |
        isort --check-only src/
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Run security check with bandit
      run: |
        pip install --no-cache-dir bandit
        bandit -r src/ -f json -o bandit-report.json || true
      continue-on-error: true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json
        retention-days: 30
      continue-on-error: true

