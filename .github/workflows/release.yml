name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Validate evaluation scaffold
        run: |
          python scripts/validate_evaluation_manifest.py

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          git archive --format=zip --output "${REPO_NAME}-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
